version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: nusa_power_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nusapower
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: nusa_power_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  emqx:
    image: emqx:5.3.0
    container_name: nusa_power_mqtt
    ports:
      - "1883:1883"
      - "8083:8083" # WebSocket
      - "8084:8084" # WSS
      - "8883:8883" # MQTTS
      - "18083:18083" # Dashboard
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public

volumes:
  pgdata:
  redisdata:
